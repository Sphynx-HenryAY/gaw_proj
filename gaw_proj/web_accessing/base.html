$def with ( ctx )
<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<script type="text/javascript" src="//canvasjs.com/assets/script/jquery-1.11.1.min.js"></script>  
	<script type="text/javascript" src="//canvasjs.com/assets/script/jquery.canvasjs.min.js"></script> 
	<script>
(function(){
var jq = jQuery.noConflict();
jq( document ).ready( function(){

	jq( "#get_type" ).click( function(){
		jq( "#search_bar form" ).attr( "action", "/" + jq( "#search_bar form select" ).val() ).submit();
	} );

} ); // ---- end document ready
window.onload = function(){
}; // ---- end window.onload
})(); // ---- end function
	</script>

	$if "rank_data_list" in ctx:
		<script>
		var jq = jQuery.noConflict();
		window.onload = function() {
			jq("#canvas_div").CanvasJSChart({
				title: {
					text: "Occurences of Top words in Website Abstract"
				},
				theme: "theme2",
				axisY: {
					title: "Occurence Percent",
					suffix: "%"
				},
				toolTip: {
					  content: "{label} <br/> {name}: jq{y} (#percent%)"
				},
				data: [
					$:ctx.get( "rank_data_list" )
				]
			});
		}
		</script>
	<style>
	#search_bar {
		position : fixed;
		top : 0px;
		width : 100vw;
		color : #55667788;
	}
	#search_bar * {
		display : inline-flex;
		margin : auto;
	}
	#content_div {
		padding : 30px 15px 15px 15px;
	}
	input {
		margin : 0px 20px 0px 5px;
	}

	@media only screen and ( min-width: 1025px ) {
		#search_bar {
			font-size : 24px;
		}
	}
	@media only screen and ( min-width: 641px ) {
		#search_bar {
			font-size : 3rem;
		}
		#search_bar * {
			display : block;
		}
	}
	@media only screen and ( max-width: 641px ) {
		#search_bar {
			font-size : 30px;
		}
		#search_bar * {
			display : block;
		}
	}
	</style>
</head>
<body>
	<div id="search_bar">
	<form action="/" method="GET">
		$:ctx.get( "search_bar_form" ).render()
	</form>
	</div>
	<div id="content_div">
		$if ctx.get( "proc_time" ):
			Time spent: $ctx.get( "proc_time" ) s
			<br/>
			<br/>
			
		$if ctx.get( "content" ):
			$:ctx.get( "content" )	
	</div>
$if "rank_data_list" in ctx:
	<div id="canvas_div" style="width: 100%; height: 600px;">
	</div>
</body>
</html>
